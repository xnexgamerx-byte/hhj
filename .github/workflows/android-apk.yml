name: بناء نسخة أندرويد للتجربة

# بناءٌ محلّي على خوادم GitHub لا عبر Expo السحابي: بيئة العمل التي يُدفع
# منها هذا المستودع محجوبة عن خوادم Expo وقوقل، فالبديل بناءٌ يدويّ بـGradle
# هنا حيث الشبكة مفتوحة. النتيجة APK قابل للتثبيت مباشرة — كافٍ لتجربة
# العميل، وإن أردنا لاحقاً رفعه للمتجر فتلك خطوة توقيعٍ منفصلة عبر EAS.
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "عنوان الخادم داخل التطبيق — فارغاً يُؤخذ من متغيّر المستودع API_URL، وإلا Render"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      # العنوان يُخبَز داخل الحزمة، فالتطبيق المُثبَّت يعرف خادمه دون إعدادٍ من
      # صاحبه. ويُختار هنا لا في الشفرة: بعد الانتقال إلى Hetzner يُعيَّن
      # متغيّر المستودع API_URL مرّة (Settings ← Variables ← Actions)، وتخرج
      # كل نسخةٍ بعده بالعنوان الجديد. وبلا تعيينه يبقى خادم Render كما كان
      EXPO_PUBLIC_API_URL: ${{ inputs.api_url || vars.API_URL || 'https://doctorsehti-api.onrender.com' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: تثبيت الحزم
        run: npm ci

      - name: توليد مشروع أندرويد الأصلي
        run: |
          echo "الخادم داخل التطبيق: $EXPO_PUBLIC_API_URL"
          npx expo prebuild --platform android --no-install

      - name: بناء APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: doctorsehti-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
