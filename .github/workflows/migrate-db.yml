name: نقل قاعدة البيانات إلى Railway

# ينسخ قاعدة Render كاملةً إلى Railway بضغطة زر، بلا تثبيت شيءٍ على جهازك.
# الخطوات في docs/railway-cloudflare.md، وخلاصتها:
#   ١. Settings ← Secrets and variables ← Actions ← Secrets:
#        SOURCE_DATABASE_URL  رابط قاعدة Render الخارجي (External Database URL)
#        TARGET_DATABASE_URL  رابط قاعدة Railway العام (DATABASE_PUBLIC_URL)
#   ٢. Actions ← «نقل قاعدة البيانات إلى Railway» ← Run workflow ← «نعم».
#
# يمحو ما في قاعدة Railway ويضع مكانه ما في Render الآن، ولا يكتب في Render
# شيئاً. والمحو والإحلال معاملةٌ واحدة: إن فشل شيءٌ في منتصفها بقيت قاعدة
# Railway كما كانت. فتكراره آمن — الأول تجربة، والأخير لحظة التحويل.
#
# المستودع عامّ وسجلّ كل تشغيلٍ يقرؤه أيّ أحد، فلا يُطبع فيه شيءٌ من البيانات
# (‎.github/scripts/pg.sh‎). والنسخة لا تُرفع ملفّاً مرفقاً: تبقى على جهاز
# التشغيل المؤقّت وتفنى معه.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: سيُمحى ما في قاعدة Railway ويحلّ محلّه ما في Render الآن. اكتب «نعم» للمتابعة
        required: true
        type: string

permissions:
  contents: read

# تشغيلان معاً يتسابقان على قاعدةٍ واحدة
concurrency:
  group: migrate-db
  cancel-in-progress: false

defaults:
  run:
    # ‎-eo pipefail‎: خطأٌ في أي طرفٍ من أنبوبٍ يوقف الخطوة
    shell: bash

jobs:
  migrate:
    name: نسخ Render إلى Railway
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE: ${{ secrets.SOURCE_DATABASE_URL }}
      TARGET: ${{ secrets.TARGET_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: التحقق قبل البدء
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          source .github/scripts/pg.sh
          if [ "$CONFIRM" != "نعم" ]; then
            echo "::error::لم يُكتب «نعم» في خانة التأكيد — أُلغي النقل ولم يُمسّ شيء"
            exit 1
          fi
          fail=0
          check_url SOURCE_DATABASE_URL "$SOURCE" || fail=1
          check_url TARGET_DATABASE_URL "$TARGET" || fail=1
          if [ "$fail" = 0 ] && [ "$SOURCE" = "$TARGET" ]; then
            echo "::error::الرابطان لقاعدةٍ واحدة — المصدر Render والهدف Railway"
            fail=1
          fi
          exit "$fail"

      - name: إصدار القاعدتين
        id: versions
        run: |
          source .github/scripts/pg.sh
          if ! source_major=$(pg_major "$SOURCE"); then
            echo "::error::تعذّر الاتصال بقاعدة Render — راجع SOURCE_DATABASE_URL، وأن القاعدة تقبل الاتصال من الخارج (صفحتها في Render ← Networking)"
            exit 1
          fi
          if ! target_major=$(pg_major "$TARGET"); then
            echo "::error::تعذّر الاتصال بقاعدة Railway — راجع TARGET_DATABASE_URL، وأن خدمة Postgres تعمل"
            exit 1
          fi
          echo "Render: PostgreSQL $source_major · Railway: PostgreSQL $target_major"
          # الأدوات بالإصدار الأحدث منهما: pg_dump لا يقرأ قاعدةً أحدث منه
          tools=$(( source_major > target_major ? source_major : target_major ))
          {
            echo "tools=$tools"
            echo "downgrade=$(( source_major > target_major ))"
          } >> "$GITHUB_OUTPUT"

      - name: نسخة من Render
        env:
          TOOLS: ${{ steps.versions.outputs.tools }}
        run: |
          source .github/scripts/pg.sh
          if ! pg_dump_public "$TOOLS" "$SOURCE" > "$RUNNER_TEMP/render.sql"; then
            echo "::error::تعذّر أخذ النسخة من Render — الخطأ أعلاه. لم يُمسّ شيءٌ في Railway"
            exit 1
          fi

      - name: إحلالها مكان قاعدة Railway
        env:
          TOOLS: ${{ steps.versions.outputs.tools }}
          DOWNGRADE: ${{ steps.versions.outputs.downgrade }}
        run: |
          source .github/scripts/pg.sh
          if ! pg_replace "$TOOLS" "$TARGET" "$RUNNER_TEMP/render.sql"; then
            if [ "$DOWNGRADE" = 1 ]; then
              echo "::error::قاعدة Railway أقدم إصداراً من Render (انظر خطوة الإصدار)، فلم تقبل النسخة. رقّها إلى إصدار Render ثم أعد التشغيل — قاعدة Railway لم تُمسّ"
            else
              echo "::error::توقّف الإحلال عند الخطأ أعلاه، وقاعدة Railway بقيت كما كانت"
            fi
            exit 1
          fi
          echo "أُحلّت النسخة في Railway"

      - name: مطابقة الجداول
        env:
          TOOLS: ${{ steps.versions.outputs.tools }}
        run: |
          source .github/scripts/pg.sh
          # عدد صفوف كل جدولٍ في الطرفين — يُقارن هنا ولا يُطبع
          pg_counts "$TOOLS" "$SOURCE" > "$RUNNER_TEMP/source.txt"
          pg_counts "$TOOLS" "$TARGET" > "$RUNNER_TEMP/target.txt"

          if cmp -s "$RUNNER_TEMP/source.txt" "$RUNNER_TEMP/target.txt"; then
            echo "✔ تطابقت الجداول كلّها ($(wc -l < "$RUNNER_TEMP/target.txt")) بين Render وRailway"
          else
            # ‎diff‎ يخرج بـ١ حين يجد فرقاً — وهو المتوقَّع هنا لا خطأ
            changed=$({ diff "$RUNNER_TEMP/source.txt" "$RUNNER_TEMP/target.txt" || true; } | awk '/^[<>]/ { print $2 }' | sort -u | paste -sd ' ' -)
            echo "::warning::تغيّر في Render أثناء النقل: $changed. طبيعيٌّ في التجربة وRender يعمل. أمّا لحظة التحويل، وخادم Render موقوف، فأعد التشغيل حتى تتطابق"
          fi
