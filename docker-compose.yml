# قاعدة البيانات للتطوير المحلي.
# التشغيل: docker compose up -d
#
# أسماء «mawid» هنا بقيت على حالها رغم تسمية التطبيق «دكتور صحتي» (بعد اسمٍ
# وسيطٍ آخر): هي اسم قاعدة البيانات ومستخدمها ومجلّد بياناتها، وتبديلها يعني
# تفريغ القاعدة القائمة واستيرادها من جديد وتحديث DATABASE_URL في كل جهاز —
# كلفةٌ حقيقية مقابل اسمٍ لا يراه أحد خارج هذا الملف. تُبدَّل عند أول نشرٍ
# حقيقي حين تُبنى قاعدة جديدة.
services:
  db:
    image: postgres:16-alpine
    container_name: mawid-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mawid
      POSTGRES_PASSWORD: mawid
      POSTGRES_DB: mawid
      # ترتيب عربي صحيح في الفرز
      LANG: ar_IQ.utf8
    ports:
      # منفذ المضيف قابل للتغيير: DB_PORT=5433 docker compose up -d
      # لو كان عندك بوستغرس آخر يشغّل ٥٤٣٢ فلن يقلع هذا بدونه
      - "${DB_PORT:-5432}:5432"
    volumes:
      - mawid-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mawid -d mawid"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mawid-data:
