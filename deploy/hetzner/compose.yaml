# خادم دكتور صحتي على Hetzner: قاعدة البيانات، والخادم، وCaddy أمامهما بشهادة HTTPS.
#
# يُشغَّل من هذا المجلّد بعد إعداد ‎.env‎ (يكتبه setup.sh):
#   docker compose up -d --build
#
# البيانات في ثلاثة أقراص مسمّاة تبقى مع إعادة البناء والتحديث: القاعدة،
# والصور، وشهادات Caddy. والنسخ الاحتياطي في backup.sh.
name: doctorsehti

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: doctorsehti
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD غير معيَّن في .env}
      POSTGRES_DB: doctorsehti
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doctorsehti -d doctorsehti"]
      interval: 5s
      timeout: 3s
      retries: 20
    # لا منفذ منشوراً: القاعدة لا تُرى من الإنترنت، يصلها الخادم وحده عبر شبكة الحاويات

  api:
    build: ../../api
    restart: unless-stopped
    # tini أوّلاً: يمرّر إشارة الإيقاف إلى الخادم فيغلق الطلبات الجارية بهدوء
    init: true
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://doctorsehti:${DB_PASSWORD}@db:5432/doctorsehti?schema=public
      UPLOAD_DIR: /data/uploads
      # الطلبات لا تصل إلا عبر Caddy، وCaddy يكتب عنوان المرسل الحقيقي ولا
      # يمرّر ما يدّعيه المرسل — فتصديقه هنا آمن، وبدونه يقتسم الجميع حدّ المعدّل
      TRUST_PROXY: "true"
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    # لا منفذ منشوراً كذلك: الطريق الوحيد إليه Caddy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN غير معيَّن في .env}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL غير معيَّن في .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

volumes:
  db-data:
  uploads:
  caddy-data:
  caddy-config:
